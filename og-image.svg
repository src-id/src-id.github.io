<?xml version="1.0" encoding="utf-8"?>
<!-- OpenGraph Banner 1200x630 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .bg { fill: #070709; }
      .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 56px;
        fill: #FFFFFF;
        letter-spacing: -0.03em;
      }
      .subtitle {
        font-family: 'DM Mono', monospace;
        font-weight: 400;
        font-size: 20px;
        fill: #A1A1AA;
        letter-spacing: 0.08em;
      }
      .badge {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        fill: #34D399;
        letter-spacing: 0.15em;
      }
      .meta {
        font-family: 'DM Mono', monospace;
        font-size: 14px;
        fill: #71717A;
      }
    </style>
    <radialGradient id="glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>
  <circle cx="950" cy="315" r="450" fill="url(#glow)"/>

  <!-- Faint decorative background grid -->
  <line x1="0" y1="120" x2="1200" y2="120" class="grid-line"/>
  <line x1="0" y1="510" x2="1200" y2="510" class="grid-line"/>
  <line x1="160" y1="0" x2="160" y2="630" class="grid-line"/>
  <line x1="1040" y1="0" x2="1040" y2="630" class="grid-line"/>

  <!-- Left Content -->
  <g transform="translate(160, 210)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="32" y="21" class="badge">INDONESIA • UTC+7</text>

    <!-- Main Heading -->
    <text x="0" y="96" class="title">Software Engineering</text>
    <text x="0" y="156" class="title">&amp; IT Consulting.</text>

    <!-- Subtitle -->
    <text x="0" y="216" class="subtitle">SRC • RESILIENT SYSTEMS &amp; CLOUD ARCHITECTURE</text>
  </g>

  <!-- Bottom Meta -->
  <text x="160" y="555" class="meta">src-id.github.io  |  github.com/src-id</text>

  <!-- Right Logo Monogram -->
  <g transform="translate(800, 195) scale(0.44)">
    <g transform="matrix(1, 0, 0, 1, 25, 25)">
      <rect width="250" height="250" style="stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-width: 50px;" x="250"/>
      <rect width="250" height="250" style="stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-width: 50px;" y="250"/>
      <line style="stroke: #FFFFFF; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-width: 50px;" x1="250" y1="250" x2="500" y2="500"/>
    </g>
  </g>
</svg>
